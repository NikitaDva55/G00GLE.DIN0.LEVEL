<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Google Dino T-Rex Level</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Анімований фон лише з простими хмаринками -->
  <div class="background">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
  </div>

  <!-- Центрована картка -->
  <div class="card-container">
    <h1 class="title">
      <span class="highlight">Secret </span>
      <span class="google-g">G</span><span class="google-o1">o</span><span class="google-o2">o</span><span class="google-g2">g</span><span class="google-l">l</span><span class="google-e">e</span>
      <span class="highlight"> Dino Level</span>
    </h1>

    <div class="qr-wrapper">
      <img 
        src="https://upload.wikimedia.org/wikipedia/commons/5/55/RickRoll_QR_Code.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" 
        alt="RickRoll QR Code" 
        class="qr-image"
      />
    </div>

    <p class="subtitle">Scan the QR code to unlock the secret level!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
